name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev zlib1g-dev libfdt-dev libselinux1-dev python3 git wget cpio clang lld llvm

      - name: Clone Kernel Source
        run: |
          echo "Meng-clone source code kernel..."
          git clone --recursive https://github.com/1tovgar/kernel_xiaomi_agate.git -b agate-u-oss kernel_source

      - name: Start Kernel Compilation
        run: |
          cd kernel_source
          git submodule update --init --recursive
          
          # Restore Makefile genheaders jika sempat terubah
          git checkout scripts/selinux/genheaders/Makefile scripts/selinux/Makefile 2>/dev/null || true
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out ARCH=arm64 agate_defconfig
          
          # Build host tools terlebih dahulu menggunakan Host GCC
          make O=out ARCH=arm64 HOSTCC=gcc HOSTCXX=g++ HOSTCFLAGS="-O2 -I/usr/include" HOST_EXTRACFLAGS="-Wno-error=deprecated-declarations" prepare scripts
          
          # Lanjutkan kompilasi kernel utama dengan Clang
          make O=out ARCH=arm64 CC=clang AS=aarch64-linux-gnu-as LD=ld.lld AR=aarch64-linux-gnu-ar CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- HOSTCC=gcc KCFLAGS="-w -Wno-error" CONFIG_SECTION_MISMATCH_WARN_ONLY=y -j$(nproc)

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-agate
          path: kernel_source/out/arch/arm64/boot/Image*
