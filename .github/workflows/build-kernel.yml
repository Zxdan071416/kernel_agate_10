name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git wget cpio

      - name: Clone Kernel Source
        run: |
          echo "Mengunduh source code kernel Xiaomi 11T..."
          git clone --depth=1 https://github.com/1tovgar/kernel_xiaomi_agate.git kernel_source
          cd kernel_source
          echo "Source code berhasil diunduh!"
          
