name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev zlib1g-dev libfdt-dev libselinux1-dev python3 git wget cpio clang lld llvm

      - name: Clone Kernel Source
        run: |
          echo "Meng-clone source code kernel..."
          git clone --recursive https://github.com/1tovgar/kernel_xiaomi_agate.git -b agate-u-oss kernel_source

      - name: Start Kernel Compilation
        run: |
          cd kernel_source
          git submodule update --init --recursive
          
          # Bypass scripts host selinux
          echo "obj-y :=" > scripts/selinux/Makefile
          echo "subdir- :=" >> scripts/selinux/Makefile
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out ARCH=arm64 agate_defconfig
          
          # Tangkap log kompilasi ke build.log untuk analisa error presisi
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="-w" HOST_EXTRACFLAGS="-w" KCFLAGS="-w -Wno-error" CONFIG_SECTION_MISMATCH_WARN_ONLY=y -j$(nproc) 2>&1 | tee build.log || true
          
          # Jika gagal, tampilkan 50 baris yang mengandung keyword error
          if [ ! -f out/arch/arm64/boot/Image ] && [ ! -f out/arch/arm64/boot/Image.gz ]; then
            echo "================ ERROR DETECTED ================"
            grep -i -C 3 "error:" build.log | tail -n 50
            exit 1
          fi

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-agate
          path: kernel_source/out/arch/arm64/boot/Image*
