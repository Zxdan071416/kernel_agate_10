name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git wget cpio

      - name: Clone Kernel Source & Toolchain
        run: |
          git clone --depth=1 https://github.com/1tovgar/kernel_xiaomi_agate.git kernel_source
          cd kernel_source
          # Mengunduh toolchain GCC untuk kompilasi arm64
          git clone --depth=1 https://github.com/chenxiaolong/Toolchain.git toolchain

      - name: Start Kernel Compilation
        run: |
          cd kernel_source
          echo "Memulai konfigurasi dan kompilasi kernel Xiaomi 11T..."
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$(pwd)/toolchain/bin:$PATH"
          
          # Cek ketersediaan compiler
          aarch64-linux-gnu-gcc --version
          
          # Gunakan defconfig bawaan perangkat agate
          make O=out vendor/agate_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc
          
          echo "Proses kompilasi tahap awal selesai!"
          
