name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential binutils-aarch64-linux-gnu gcc-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev zlib1g-dev libfdt-dev libselinux1-dev python3 git wget cpio clang lld llvm

      - name: Clone Kernel Source
        run: |
          echo "Meng-clone source code kernel..."
          git clone --recursive https://github.com/1tovgar/kernel_xiaomi_agate.git -b agate-u-oss kernel_source

      - name: Start Kernel Compilation
        run: |
          cd kernel_source
          git submodule update --init --recursive
          
          # Netralkan Makefile SELinux host tools
          echo "obj-y :=" > scripts/selinux/Makefile
          echo "subdir- :=" >> scripts/selinux/Makefile
          echo "hostprogs-y :=" > scripts/selinux/genheaders/Makefile
          echo "all:" >> scripts/selinux/genheaders/Makefile
          
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out ARCH=arm64 agate_defconfig
          
          # Paksa gunakan GNU linker (aarch64-linux-gnu-ld) untuk tahap linking akhir
          make -j$(nproc) O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            LD=aarch64-linux-gnu-ld \
            AR=aarch64-linux-gnu-ar \
            OBJCOPY=aarch64-linux-gnu-objcopy \
            OBJDUMP=aarch64-linux-gnu-objdump \
            STRIP=aarch64-linux-gnu-strip \
            HOSTCFLAGS="-w" \
            HOST_EXTRACFLAGS="-w" \
            KCFLAGS="-w -Wno-error" \
            CONFIG_SECTION_MISMATCH_WARN_ONLY=y

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image-agate
          path: kernel_source/out/arch/arm64/boot/Image*
