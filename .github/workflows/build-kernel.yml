name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev libfdt-dev libselinux1-dev python3 git wget cpio clang lld llvm

      - name: Clone Kernel Source
        run: |
          echo "Meng-clone source code kernel..."
          git clone --recursive https://github.com/1tovgar/kernel_xiaomi_agate.git -b agate-u-oss kernel_source

      - name: Start Kernel Compilation
        run: |
          cd kernel_source
          echo "Memastikan submodule ter-load..."
          git submodule update --init --recursive
          
          # Bypass scripts host selinux yang bermasalah
          echo "obj-y :=" > scripts/selinux/Makefile
          echo "subdir- :=" >> scripts/selinux/Makefile
          
          echo "Memulai proses kompilasi kernel Xiaomi 11T..."
          export ARCH=arm64
          export SUBARCH=arm64
          
          make O=out ARCH=arm64 agate_defconfig
          
          # Gunakan bundel LLVM=1 standar Google/Android
          make O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- HOSTCFLAGS="-w" HOST_EXTRACFLAGS="-w" KCFLAGS="-w -Wno-error" CONFIG_SECTION_MISMATCH_WARN_ONLY=y -j$(nproc)
          
          echo "Kompilasi kernel selesai!"

      - name: Check Output Kernel
        run: |
          cd kernel_source/out/arch/arm64/boot
          ls -la

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz-dtb-agate
          path: kernel_source/out/arch/arm64/boot/Image*
