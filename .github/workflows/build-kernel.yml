name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git wget cpio unzip

      - name: Download Source ZIP
        run: |
          echo "Mengunduh source code kernel..."
          wget -O kernel.zip https://github.com/1tovgar/kernel_xiaomi_agate/archive/refs/heads/agate-u-oss.zip
          unzip -q kernel.zip
          mv kernel_xiaomi_agate-agate-u-oss kernel_source

      - name: Start Kernel Compilation
        run: |
          cd kernel_source
          echo "Memulai proses kompilasi kernel Xiaomi 11T..."
          export ARCH=arm64
          export SUBARCH=arm64
          
          # Cek compiler bawaan
          aarch64-linux-gnu-gcc --version
          
          # Jalankan konfigurasi dan build menggunakan compiler sistem
          make O=out ARCH=arm64 agate_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=aarch64-linux-gnu-gcc CROSS_COMPILE=aarch64-linux-gnu-
          
          echo "Kompilasi kernel berhasil dijalankan!"
