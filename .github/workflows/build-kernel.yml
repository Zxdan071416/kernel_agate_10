name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git wget cpio unzip

      - name: Download Source ZIP
        run: |
          echo "Mengunduh source code kernel..."
          wget -O kernel.zip https://github.com/1tovgar/kernel_xiaomi_agate/archive/refs/heads/agate-u-oss.zip
          unzip kernel.zip
          mv kernel_xiaomi_agate-agate-u-oss kernel_source

      - name: Check Folder Structure
        run: |
          cd kernel_source
          echo "Menampilkan isi folder utama kernel:"
          ls -la
          echo "Mencari file defconfig di dalam folder arch:"
          find arch/arm64/configs -maxdepth 3
