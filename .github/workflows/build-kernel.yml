name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev zlib1g-dev libfdt-dev python3 git wget cpio unzip

      - name: Clone Source & Download Clang ZIP
        run: |
          echo "Meng-clone source code kernel..."
          git clone --recursive https://github.com/1tovgar/kernel_xiaomi_agate.git -b agate-u-oss kernel_source
          
          echo "Mengunduh Clang Toolchain ZIP..."
          wget -O clang.zip https://github.com/Neutrino-Kernel/nongpl-clang/archive/refs/heads/main.zip
          unzip -q clang.zip
          mv nongpl-clang-main clang-toolchain

      - name: Start Kernel Compilation
        run: |
          cd kernel_source
          echo "Memulai proses kompilasi kernel Xiaomi 11T..."
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="$GITHUB_WORKSPACE/clang-toolchain/bin:$PATH"
          
          # Konfigurasi dan build menggunakan Clang
          make O=out ARCH=arm64 agate_defconfig
          make -j$(nproc) O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- KCFLAGS="-w" CONFIG_SECTION_MISMATCH_WARN_ONLY=y
          
          echo "Kompilasi kernel selesai!"
