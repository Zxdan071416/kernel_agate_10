name: Build Kernel Xiaomi 11T

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc g++ bc bison flex libssl-dev libelf-dev zlib1g-dev python3 git wget cpio

      - name: Clone Kernel Source & Setup Toolchain
        run: |
          echo "Menyiapkan direktori dan toolchain untuk kompilasi kernel Xiaomi 11T..."
          git config --global user.name "Builder"
          git config --global user.email "builder@action.com"
          
